name: Cloud Audio Crawler to Google Drive

on:
  # 1. Chế độ Tự Động 24/7: Cứ mỗi 4 tiếng tự cào theo từ khóa/danh sách link
  schedule:
    - cron: '0 */4 * * *'

  # 2. Chế độ Ưu Tiên Tức Thì: Nhận link bạn gửi từ Telegram trên điện thoại
  repository_dispatch:
    types: [telegram_crawl]

  # 3. Chế độ Thủ Công: Bấm nút chạy trên GitHub Web hoặc App
  workflow_dispatch:
    inputs:
      platform:
        description: 'Nền tảng (tiktok hoặc facebook)'
        required: true
        default: 'tiktok'
        type: choice
        options:
          - tiktok
          - facebook
      keyword:
        description: 'Link video, link kênh, hoặc urls.txt'
        required: true
        default: 'urls.txt'
      workers:
        description: 'Số luồng chạy song song'
        required: true
        default: '4'

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 💾 Cache Pip Packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: 🎬 Setup FFmpeg & Rclone (Siêu tốc 3s - Static Binary)
        run: |
          curl -sL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | sudo tar -xJ --strip-components=2 -C /usr/local/bin/ ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg-master-latest-linux64-gpl/bin/ffprobe
          curl -s https://rclone.org/install.sh | sudo bash

      - name: 📦 Install Fast CPU Dependencies (Tận dụng Cache)
        run: |
          pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: ⚙️ Parse Input Parameters (Dual-Mode Engine)
        id: params
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            URLS="${{ github.event.client_payload.urls }}"
            URL="${{ github.event.client_payload.url }}"
            CHAT_ID="${{ github.event.client_payload.chat_id }}"
            
            if [ -n "$URLS" ]; then
              printf "%s\n" "$URLS" > batch_urls.txt
              KEYWORD="batch_urls.txt"
              if echo "$URLS" | grep -qi "tiktok.com"; then
                PLATFORM="tiktok"
              else
                PLATFORM="facebook"
              fi
            else
              KEYWORD="$URL"
              if [[ "$URL" == *"tiktok.com"* ]]; then
                PLATFORM="tiktok"
              else
                PLATFORM="facebook"
              fi
            fi
            
            echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
            echo "keyword=$KEYWORD" >> $GITHUB_OUTPUT
            echo "chat_id=$CHAT_ID" >> $GITHUB_OUTPUT
            echo "workers=2" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            # ──────────────────────────────────────────────────────────
            # CẤU HÌNH CÀO TỰ ĐỘNG THEO LỊCH 24/7 (CRON SCHEDULE)
            # Bạn có thể đổi platform (tiktok/facebook) và keyword tại đây:
            # ──────────────────────────────────────────────────────────
            echo "platform=tiktok" >> $GITHUB_OUTPUT
            echo "keyword=urls.txt" >> $GITHUB_OUTPUT
            echo "chat_id=" >> $GITHUB_OUTPUT
            echo "workers=4" >> $GITHUB_OUTPUT
          else
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
            echo "keyword=${{ github.event.inputs.keyword }}" >> $GITHUB_OUTPUT
            echo "chat_id=" >> $GITHUB_OUTPUT
            echo "workers=${{ github.event.inputs.workers }}" >> $GITHUB_OUTPUT
          fi

      - name: ☁️ Configure Rclone & Pull Existing Metadata from Google Drive
        run: |
          mkdir -p ~/.config/rclone
          cat << 'EOF' > ~/.config/rclone/rclone.conf
          ${{ secrets.RCLONE_CONFIG }}
          EOF
          
          # Kéo metadata và danh sách ID đã cào từ Google Drive về trước để cộng dồn
          echo "📥 Đang đồng bộ metadata và seen_ids cũ từ Google Drive..."
          rclone copy gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:Week2/ Week2/ --include "metadata.json" --include "summary.json" || true
          mkdir -p .checkpoints
          rclone copy gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:seen_ids.json .checkpoints/ || true

      - name: 🚀 Run Audio Crawler Pipeline (☁️ Cloud Fast Mode)
        env:
          CLOUD_MODE: "1"
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "⏰ [SCHEDULE CRON] Đang chạy cào tự động 24/7 chuyên đề TIN TỨC & HỌC ONLINE trên TikTok..."
            
            # 1. Ưu tiên cào file urls.txt nếu có link mới
            if [ -f "urls.txt" ]; then
              echo "📝 [1/3] Cào danh sách link từ urls.txt..."
              python main.py --platform tiktok --keyword "urls.txt" --workers 4 || true
            fi
            
            # 2. Cào các KÊNH TIN TỨC & HỌC ONLINE chính thống trên TikTok
            CHANNELS=(
              "https://www.tiktok.com/@vtv24news"
              "https://www.tiktok.com/@dantri.com.vn"
              "https://www.tiktok.com/@vnexpress.official"
              "https://www.tiktok.com/@thanhnien.official"
              "https://www.tiktok.com/@tuoitreonline"
              "https://www.tiktok.com/@vtctintuc"
              "https://www.tiktok.com/@hocmai.vn"
              "https://www.tiktok.com/@onluyen.vn"
              "https://www.tiktok.com/@tuyensinh247.com"
              "https://www.tiktok.com/@kienthuc.thuvi"
            )
            for SOURCE in "${CHANNELS[@]}"; do
              echo "🎙️ [2/3] Cào kênh chính thống: $SOURCE"
              python main.py --platform tiktok --keyword "$SOURCE" --max-results 25 --workers 4 || true
            done

            # 3. Cào theo TỪ KHÓA TÌM KIẾM liên quan đến Tin tức & Học online
            KEYWORDS=(
              "tin tức thời sự hôm nay"
              "tin tức 24h mới nhất"
              "tin nóng thời sự việt nam"
              "học online hiệu quả"
              "phương pháp học online"
              "kinh nghiệm học online"
              "bài giảng online"
              "tự học online mỗi ngày"
              "hướng dẫn học trực tuyến"
            )
            for KW in "${KEYWORDS[@]}"; do
              echo "🔍 [3/3] Cào theo từ khóa: $KW"
              python main.py --platform tiktok --keyword "$KW" --max-results 25 --workers 4 || true
            done
          else
            # Chạy khi nhận link Telegram hoặc bấm nút thủ công
            python main.py \
              --platform ${{ steps.params.outputs.platform }} \
              --keyword "${{ steps.params.outputs.keyword }}" \
              --workers ${{ steps.params.outputs.workers }}
          fi

      - name: 📤 Sync Audio Files to Google Drive
        if: always()
        run: |
          if [ -d "Week2" ]; then
            echo "📤 Đang đẩy toàn bộ audio mới lên Google Drive..."
            rclone copy Week2/ gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:Week2/ --exclude "transcripts/**" --exclude "metadata_extended.json" --exclude "yield_funnel.json" --exclude "quarantine/**" --transfers 8 --checkers 16 --progress
          fi
          if [ -f ".checkpoints/seen_ids.json" ]; then
            rclone copy .checkpoints/seen_ids.json gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw: --progress
          fi

      - name: 🛡️ Master Cumulative Reconciler (100% Remote Sync Guard)
        if: always()
        run: |
          python tools/reconcile_drive.py --remote || true

      - name: 🧹 Google Drive Remote Sanitizer (Strict 3-Item Spec Guard)
        if: always()
        run: |
          echo "🧹 Quét dọn tự động để Google Drive chỉ chứa duy nhất audio/, metadata.json, summary.json..."
          for DATE_DIR in $(rclone lsf "gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:Week2/" --dirs-only); do
            rclone deletefile "gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:Week2/${DATE_DIR}metadata_extended.json" || true
            rclone deletefile "gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:Week2/${DATE_DIR}yield_funnel.json" || true
            rclone purge "gdrive,root_folder_id=16iuu3_UtaGtNEuHJksZAlEeBcqYhclSw:Week2/${DATE_DIR}transcripts" || true
          done

      - name: 📩 Send Telegram Notification
        if: always()
        run: |
          CHAT_ID="${{ steps.params.outputs.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            SUMMARY_FILE=$(find Week2 -name "summary.json" | head -n 1)
            if [ -f "$SUMMARY_FILE" ]; then
              ITEMS=$(grep '"items_delivered"' "$SUMMARY_FILE" | head -n 1 | awk -F: '{print $2}' | tr -d ' ,')
              HOURS=$(grep '"total_hours"' "$SUMMARY_FILE" | head -n 1 | awk -F: '{print $2}' | tr -d ' ,')
              MSG="🎉 <b>ĐÃ CÀO XONG VÀ ĐỒNG BỘ GOOGLE DRIVE!</b>%0A• 🎯 File thành công: <b>${ITEMS:-1} file</b>%0A• ⏱️ Tổng thời lượng: <b>${HOURS:-0} giờ</b>%0A• ☁️ Thư mục Drive: <code>Trương Duy Cường/Week2/</code>"
            else
              MSG="🎉 <b>TIẾN TRÌNH CÀO HOÀN TẤT</b>%0A• File âm thanh đã được đồng bộ lên Google Drive của bạn!"
            fi
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=HTML"
          fi
