name: Cloud Audio Crawler to Google Drive

on:
  # 1. Chế độ Tự Động 24/7: Cứ mỗi 4 tiếng tự cào theo từ khóa/danh sách link
  schedule:
    - cron: '0 */4 * * *'

  # 2. Chế độ Ưu Tiên Tức Thì: Nhận link bạn gửi từ Telegram trên điện thoại
  repository_dispatch:
    types: [telegram_crawl]

  # 3. Chế độ Thủ Công: Bấm nút chạy trên GitHub Web hoặc App
  workflow_dispatch:
    inputs:
      platform:
        description: 'Nền tảng (tiktok hoặc facebook)'
        required: true
        default: 'tiktok'
        type: choice
        options:
          - tiktok
          - facebook
      keyword:
        description: 'Link video, link kênh, hoặc urls.txt'
        required: true
        default: 'urls.txt'
      workers:
        description: 'Số luồng chạy song song'
        required: true
        default: '4'

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎬 Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 📦 Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚙️ Parse Input Parameters (Dual-Mode Engine)
        id: params
        run: |
          # ─── TRƯỜNG HỢP A: Bạn gửi link từ Telegram (ƯU TIÊN HÀNG ĐẦU) ───
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            URL="${{ github.event.client_payload.url }}"
            CHAT_ID="${{ github.event.client_payload.chat_id }}"
            
            if [[ "$URL" == *"tiktok.com"* ]]; then
              PLATFORM="tiktok"
            else
              PLATFORM="facebook"
            fi
            
            echo "platform=$PLATFORM" >> $GITHUB_OUTPUT
            echo "keyword=$URL" >> $GITHUB_OUTPUT
            echo "chat_id=$CHAT_ID" >> $GITHUB_OUTPUT
            echo "workers=2" >> $GITHUB_OUTPUT
            echo "mode=Telegram On-Demand"

          # ─── TRƯỜNG HỢP B: Chạy tự động định kỳ 24/7 theo lịch ───
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "platform=facebook" >> $GITHUB_OUTPUT
            echo "keyword=học tiếng Việt" >> $GITHUB_OUTPUT
            echo "chat_id=" >> $GITHUB_OUTPUT
            echo "workers=4" >> $GITHUB_OUTPUT
            echo "mode=Auto Schedule 24/7"

          # ─── TRƯỜNG HỢP C: Kích hoạt thủ công từ giao diện Web/App ───
          else
            echo "platform=${{ github.event.inputs.platform }}" >> $GITHUB_OUTPUT
            echo "keyword=${{ github.event.inputs.keyword }}" >> $GITHUB_OUTPUT
            echo "chat_id=" >> $GITHUB_OUTPUT
            echo "workers=${{ github.event.inputs.workers }}" >> $GITHUB_OUTPUT
            echo "mode=Manual Web Trigger"
          fi

      - name: 🚀 Run Audio Crawler Pipeline with Hybrid AI
        run: |
          python main.py \
            --platform ${{ steps.params.outputs.platform }} \
            --keyword "${{ steps.params.outputs.keyword }}" \
            --workers ${{ steps.params.outputs.workers }}

      - name: ☁️ Install & Configure Rclone
        if: always()
        run: |
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONFIG }}" > ~/.config/rclone/rclone.conf

      - name: 📤 Sync Audio Dataset to Google Drive
        if: always()
        run: |
          if [ -d "Week2" ]; then
            rclone copy Week2/ gdrive:ASR_Dataset/Week2/ --progress
          fi

      - name: 📩 Send Telegram Notification
        if: always()
        run: |
          CHAT_ID="${{ steps.params.outputs.chat_id }}"
          BOT_TOKEN="${{ secrets.TELEGRAM_BOT_TOKEN }}"
          
          if [ -n "$CHAT_ID" ] && [ -n "$BOT_TOKEN" ]; then
            SUMMARY_FILE=$(find Week2 -name "summary.json" | head -n 1)
            if [ -f "$SUMMARY_FILE" ]; then
              ITEMS=$(grep '"items_delivered"' "$SUMMARY_FILE" | head -n 1 | awk -F: '{print $2}' | tr -d ' ,')
              HOURS=$(grep '"total_hours"' "$SUMMARY_FILE" | head -n 1 | awk -F: '{print $2}' | tr -d ' ,')
              MSG="🎉 *ĐÃ CÀO XONG VÀ ĐỒNG BỘ GOOGLE DRIVE!*%0A• 🎯 File thành công: *$ITEMS file*%0A• ⏱️ Tổng thời lượng: *$HOURS giờ*%0A• ☁️ Google Drive: \`ASR_Dataset/Week2/\`"
            else
              MSG="⚠️ *TIẾN TRÌNH CÀO HOÀN TẤT*%0A• File đã được đồng bộ lên Google Drive."
            fi
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=${MSG}" \
              -d "parse_mode=Markdown"
          fi
